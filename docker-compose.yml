version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: movie-bot-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-movie_bot}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - movie-bot-network

  api_server:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: movie-bot-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-movie_bot}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - movie-bot-network
    volumes:
      - ./api_server:/app/api_server
      - ./db:/app/db
      - ./datasets:/app/datasets

volumes:
  postgres_data:

networks:
  movie-bot-network:
    driver: bridge
